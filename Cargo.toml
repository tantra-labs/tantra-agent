[workspace]
resolver = "2"
members = [
  "crates/tantra-agent",
  "crates/tantra-agent-core",
  "crates/tantra-agent-llm",
  "crates/tantra-agent-prompt",
  "crates/tantra-agent-replay",
  "crates/tantra-agent-trader-loop",
  "crates/tantra-agent-research",
  "crates/tantra-agent-analytics",
  "crates/tantra-agent-genetic",
  "crates/tantra-agent-mcp",
  "crates/tantra-agent-tools",
  "crates/tantra-agent-plugins",
  "crates/tantra-agent-report",
  "crates/tantra-agent-chat",
  "crates/tantra-agent-chat-tools",
  "crates/tantra-agent-forecast",
  "crates/tantra-agent-panel",
  "crates/tantra-agent-acp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/tantra-labs/tantra-agent"

[workspace.dependencies]
# Internal agent crates
tantra-agent = { path = "crates/tantra-agent" }
tantra-agent-core = { path = "crates/tantra-agent-core" }
tantra-agent-llm = { path = "crates/tantra-agent-llm" }
tantra-agent-prompt = { path = "crates/tantra-agent-prompt" }
tantra-agent-replay = { path = "crates/tantra-agent-replay" }
tantra-agent-trader-loop = { path = "crates/tantra-agent-trader-loop" }
tantra-agent-research = { path = "crates/tantra-agent-research" }
tantra-agent-analytics = { path = "crates/tantra-agent-analytics" }
tantra-agent-genetic = { path = "crates/tantra-agent-genetic" }
tantra-agent-mcp = { path = "crates/tantra-agent-mcp" }
tantra-agent-tools = { path = "crates/tantra-agent-tools" }
tantra-agent-plugins = { path = "crates/tantra-agent-plugins" }
tantra-agent-report = { path = "crates/tantra-agent-report" }
tantra-agent-chat = { path = "crates/tantra-agent-chat" }
tantra-agent-chat-tools = { path = "crates/tantra-agent-chat-tools" }
tantra-agent-forecast = { path = "crates/tantra-agent-forecast" }
tantra-agent-panel = { path = "crates/tantra-agent-panel" }
tantra-agent-acp = { path = "crates/tantra-agent-acp" }
tantra-core = { path = "../tantra-core" }
tantra-risk = { path = "../tantra-risk" }
tantra-ledger = { path = "../tantra-ledger/crates/tantra-ledger" }
tantra-ledger-oms = { path = "../tantra-ledger/crates/tantra-ledger-oms" }
tantra-ledger-portfolio = { path = "../tantra-ledger/crates/tantra-ledger-portfolio" }
tantra-ledger-journal = { path = "../tantra-ledger/crates/tantra-ledger-journal" }
tantra-ledger-allocation = { path = "../tantra-ledger/crates/tantra-ledger-allocation" }
tantra-market-core = { path = "../tantra-market/crates/tantra-market-core" }
tantra-market-finance = { path = "../tantra-market/crates/tantra-market-finance" }
tantra-market-pricing = { path = "../tantra-market/crates/tantra-market-pricing" }
tantra-market-store = { path = "../tantra-market/crates/tantra-market-store" }
tantra-market-normalizer = { path = "../tantra-market/crates/tantra-market-normalizer" }
tantra-market-indicators = { path = "../tantra-market/crates/tantra-market-indicators" }
tantra-market-signals = { path = "../tantra-market/crates/tantra-market-signals" }
tantra-exec-core = { path = "../tantra-exec/crates/tantra-exec-core" }
tantra-exec-auth = { path = "../tantra-exec/crates/tantra-exec-auth" }
tantra-exec-router = { path = "../tantra-exec/crates/tantra-exec-router" }
tantra-exec-slicer = { path = "../tantra-exec/crates/tantra-exec-slicer" }
tantra-exec-audit = { path = "../tantra-exec/crates/tantra-exec-audit" }
tantra-exec-zerodha = { path = "../tantra-exec/crates/tantra-exec-zerodha" }
tantra-exec-upstox = { path = "../tantra-exec/crates/tantra-exec-upstox" }
tantra-exec-angelone = { path = "../tantra-exec/crates/tantra-exec-angelone" }
tantra-runtime-strategy = { path = "../tantra-runtime/crates/tantra-runtime-strategy" }
tantra-runtime-backtest = { path = "../tantra-runtime/crates/tantra-runtime-backtest" }
tantra-runtime-config = { path = "../tantra-runtime/crates/tantra-runtime-config" }
tantra-runtime-testing = { path = "../tantra-runtime/crates/tantra-runtime-testing" }
tantra-runtime-persistence = { path = "../tantra-runtime/crates/tantra-runtime-persistence" }
tantra-runtime-enhancer = { path = "../tantra-runtime/crates/tantra-runtime-enhancer" }
tantra-runtime-actors = { path = "../tantra-runtime/crates/tantra-runtime-actors" }
tantra-runtime-jobs = { path = "../tantra-runtime/crates/tantra-runtime-jobs" }
tantra-runtime-api = { path = "../tantra-runtime/crates/tantra-runtime-api" }
tantra-runtime-api-rest = { path = "../tantra-runtime/crates/tantra-runtime-api-rest" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sha2 = "0.10"
schemars = { version = "0.8", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
futures = "0.3"
agent-client-protocol = "=5.0.0"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sqlx = { version = "0.8", features = ["time", "sqlite", "chrono", "uuid", "macros", "migrate"] }
anyhow = "1"
bytes = "1"
rand = "0.8"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
proptest = "1"
candle-core = "0.11"
candle-transformers = "0.11"
shimmytok = "0.8"

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
