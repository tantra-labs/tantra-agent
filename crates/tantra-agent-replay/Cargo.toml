[package]
name = "tantra-agent-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptographic prompt and decision replay harness with SQLite WAL / JSONL caching for tantra-agent"

[dependencies]
tantra-core.workspace = true
tantra-risk.workspace = true
tantra-agent-core = { path = "../tantra-agent-core" }
tantra-agent-llm = { path = "../tantra-agent-llm" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
chrono.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
schemars.workspace = true
async-trait.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
# The workspace sqlx dep does not enable a runtime; the SQLite WAL cache tests
# need the tokio runtime, so enable it for test builds via feature unification.
sqlx = { workspace = true, features = ["runtime-tokio"] }
